<!doctype html>
<html>

<head>
    <meta charset="UTF-8">
    <title></title>
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' https: data: blob:; script-src 'self' 'unsafe-inline'; connect-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self' data:;">
</head>

<body>
    <script>
        window.addEventListener('message', (e) => {
            if (e.data ? .type !== 'external-download') {
                return;
            }

            const {
                url,
                type,
                method,
                body,
                headers
            } = e.data.params;

            if (!url.startsWith('https://')) {
                return;
            }

            const isJson = type === 'json';
            const isBlob = type === 'blob';

            fetch(url, {
                method,
                body,
                headers,
                referrerPolicy: 'no-referrer',
                credentials: 'omit',
            }).then((r) => isJson ? r.json() : isBlob ? r.blob() : r.text()).then(
                (result) => {
                    window.parent.postMessage({
                        type: 'download-success',
                        url,
                        result,
                    }, "*");
                },
                (error) => {
                    window.parent.postMessage({
                        type: 'download-error',
                        error
                    }, "*");
                }
            );
        });
        window.parent.postMessage({
            type: 'downloader-ready',
        }, "*");
    </script>
</body>

</html>
