# Cloudflare Pages / Wrangler configuration
# https://developers.cloudflare.com/pages/platform/wrangler/

name = "my-website-clone"
compatibility_date = "2026-11-07"

[pages]
# Build output directory that Cloudflare Pages will publish
# Leave empty to use root; we use "dist" after npm run build
build_output = "dist"

[deploy]
# This project name must match your Cloudflare Pages project
project = "my-website-clone"
